services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cineverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: cineverse
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineverse"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 15
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://cineverse:${POSTGRES_PASSWORD:-local-development-only}@db:5432/cineverse
      REDIS_URL: redis://redis:6379
      DEMO_MODE: ${DEMO_MODE:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      TMDB_TOKEN: ${TMDB_TOKEN:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      start_period: 120s
      retries: 15
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: python -m app.worker
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_ENABLE_GALAXY: ${NEXT_PUBLIC_ENABLE_GALAXY:-false}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres:
  redis:
