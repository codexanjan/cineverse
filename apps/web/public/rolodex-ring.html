<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cineverse — 3D Rolodex Ring</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #06080c;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
      background: radial-gradient(ellipse at 50% 60%, rgba(245, 197, 24, 0.08), transparent 70%);
    }
    .stage:active { cursor: grabbing; }
    .hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1px;
      height: 1px;
    }
    .card {
      position: absolute;
      top: 0;
      left: 0;
      width: 140px;
      height: 210px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.85), 0 0 20px rgba(245, 197, 24, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #0a0e14;
      will-change: transform, opacity, filter, z-index;
      cursor: pointer;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .card-scrim {
      position: absolute;
      inset: auto 0 0 0;
      padding: 24px 10px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
      pointer-events: none;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 9px;
      color: #f5c518;
      margin-top: 2px;
    }
    .instruction {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="hub" id="hub"></div>
    <div class="instruction">✦ Drag with momentum to throw the ring ✦</div>
  </div>

  <script>
    const TAU = Math.PI * 2;
    const COUNT = 22;
    const stage = document.getElementById("stage");
    const hub = document.getElementById("hub");

    const POSTERS = [
      { title: "Interstellar", poster: "https://image.tmdb.org/t/p/w342/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", year: "2014" },
      { title: "Inception", poster: "https://image.tmdb.org/t/p/w342/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg", year: "2010" },
      { title: "Pulp Fiction", poster: "https://image.tmdb.org/t/p/w342/d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg", year: "1994" },
      { title: "Spirited Away", poster: "https://image.tmdb.org/t/p/w342/39wmItIWsg5sZMyRUHLkWBcuVCM.jpg", year: "2001" },
      { title: "Fight Club", poster: "https://image.tmdb.org/t/p/w342/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg", year: "1999" },
      { title: "The Dark Knight", poster: "https://image.tmdb.org/t/p/w342/qJ2tW6WMUDux911r6m7haRef0WH.jpg", year: "2008" },
      { title: "The Matrix", poster: "https://image.tmdb.org/t/p/w342/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg", year: "1999" },
      { title: "Forrest Gump", poster: "https://image.tmdb.org/t/p/w342/arw2VCBveWOVZr6pxd9XTd1TdQa.jpg", year: "1994" },
      { title: "The Godfather", poster: "https://image.tmdb.org/t/p/w342/3bhkrj58Vtu7enYsRolD1fZdja1.jpg", year: "1972" },
      { title: "GoodFellas", poster: "https://image.tmdb.org/t/p/w342/aKuFiU82s5ISJpGZp7YkIr3kCUd.jpg", year: "1990" },
      { title: "Jurassic Park", poster: "https://image.tmdb.org/t/p/w342/b1x09rS5dqRqaN93N6xL83yq8.jpg", year: "1993" },
      { title: "Oppenheimer", poster: "https://image.tmdb.org/t/p/w342/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg", year: "2023" },
      { title: "Dune: Part Two", poster: "https://image.tmdb.org/t/p/w342/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg", year: "2024" },
      { title: "Blade Runner 2049", poster: "https://image.tmdb.org/t/p/w342/gajva2L0rPYkEWjzgFlBXCAVBE5.jpg", year: "2017" },
      { title: "Whiplash", poster: "https://image.tmdb.org/t/p/w342/7fn624j5lj3xTme2SgiLCeuedmO.jpg", year: "2014" },
      { title: "Parasite", poster: "https://image.tmdb.org/t/p/w342/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg", year: "2019" },
      { title: "Alien", poster: "https://image.tmdb.org/t/p/w342/vfrQk5IPloGg1v9Rzmu2u02eMmS.jpg", year: "1979" },
      { title: "Star Wars", poster: "https://image.tmdb.org/t/p/w342/6FfCtAuVAW8XJjZ7eWeLibRLWTw.jpg", year: "1977" },
      { title: "The Silence of the Lambs", poster: "https://image.tmdb.org/t/p/w342/uS9m8OBk1A8eM9I042bx8XXpqAq.jpg", year: "1991" },
      { title: "Se7en", poster: "https://image.tmdb.org/t/p/w342/6yoghtyTpznpBik8EngEmJsk9UO.jpg", year: "1995" },
      { title: "The Grand Budapest Hotel", poster: "https://image.tmdb.org/t/p/w342/eWdyYQreja6JGCzqHWXpWHDrrPo.jpg", year: "2014" },
      { title: "Past Lives", poster: "https://image.tmdb.org/t/p/w342/k3waqVXSnvCZWfJYNtdamTgTtTA.jpg", year: "2023" }
    ];

    const cards = [];
    for (let i = 0; i < COUNT; i++) {
      const card = document.createElement("div");
      card.className = "card";
      const movie = POSTERS[i % POSTERS.length];
      card.innerHTML = `
        <img src="${movie.poster}" alt="${movie.title}" />
        <div class="card-scrim">
          <div class="card-title">${movie.title}</div>
          <div class="card-meta">${movie.year} · ★ Curated</div>
        </div>
      `;
      hub.appendChild(card);
      cards.push(card);
    }

    let rotation = 0;
    let velocity = 0.0045;
    let isDragging = false;
    let lastX = 0;

    function loop() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      const R = 0.62 * Math.min(w, h);

      if (!isDragging) {
        velocity += (0.0045 - velocity) * 0.02;
        rotation += velocity;
      }

      const cardData = [];

      for (let i = 0; i < COUNT; i++) {
        const a = rotation + (i / COUNT) * TAU;
        const x = Math.sin(a) * R;
        const z = Math.cos(a) * R;
        const y = -Math.cos(a) * R * 0.42;

        const depth = (z / R + 1) / 2;
        const card = cards[i];

        const rotDeg = Math.sin(a) * 14;
        const scale = 0.55 + depth * 0.55;
        const opacity = 0.30 + depth * 0.70;
        const brightness = 0.5 + depth * 0.7;

        card.style.transform = `translate(-50%, -50%) translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0px) rotate(${rotDeg.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
        card.style.opacity = opacity.toFixed(3);
        card.style.filter = `brightness(${brightness.toFixed(3)})`;

        cardData.push({ idx: i, z });
      }

      cardData.sort((a, b) => a.z - b.z);
      for (let rank = 0; rank < cardData.length; rank++) {
        cards[cardData[rank].idx].style.zIndex = rank + 10;
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

    stage.addEventListener("pointerdown", (e) => {
      stage.setPointerCapture(e.pointerId);
      isDragging = true;
      velocity = 0;
      lastX = e.clientX;
    });

    stage.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      lastX = e.clientX;
      const moveVel = dx * 0.0045;
      rotation += moveVel;
      velocity = moveVel;
    });

    function endDrag(e) {
      if (isDragging) {
        isDragging = false;
        try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
      }
    }
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);
  </script>
</body>
</html>
